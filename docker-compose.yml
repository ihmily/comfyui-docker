services:
  comfyui:
    image: comfyui-full:gpu-cu130
    container_name: comfyui
    ports:
      - "8188:8188"
    environment:
      - EXTRA_ARGS=--cuda-device 0 --disable-metadata --disable-smart-memory
    volumes:
      # Mount your local directories to container
      - ./models:/app/ComfyUI/models
      - ./custom_nodes:/app/ComfyUI/custom_nodes
      - ./output:/app/ComfyUI/output
      - ./input:/app/ComfyUI/input
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
